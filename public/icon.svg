<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Glossy Cherry Red Outer Shell Gradient -->
    <linearGradient id="glossyRedShell" x1="120" y1="40" x2="440" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3b3b" />
      <stop offset="25%" stop-color="#e60000" />
      <stop offset="65%" stop-color="#aa0000" />
      <stop offset="100%" stop-color="#550000" />
    </linearGradient>

    <!-- Top Rim Specular Red Highlight -->
    <linearGradient id="topRedHighlight" x1="180" y1="20" x2="460" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#ff9999" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ff1a1a" stop-opacity="0" />
    </linearGradient>

    <!-- Piano Black Aerodynamic Wing Gradient -->
    <linearGradient id="pianoBlackWing" x1="60" y1="100" x2="300" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#353b47" />
      <stop offset="30%" stop-color="#181b22" />
      <stop offset="70%" stop-color="#090a0d" />
      <stop offset="100%" stop-color="#020304" />
    </linearGradient>

    <!-- Glossy Black Specular Reflection -->
    <linearGradient id="blackSpecGlaze" x1="50" y1="160" x2="200" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome Metallic Trim Gradient -->
    <linearGradient id="chromeTrimGrad" x1="120" y1="120" x2="360" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Inner Red Frame Bezel Gradient -->
    <linearGradient id="innerRedBezel" x1="160" y1="120" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2a2a" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#700000" />
    </linearGradient>

    <!-- Center White Play Triangle Gradient (High Gloss Pearl White) -->
    <linearGradient id="pearlWhitePlay" x1="180" y1="160" x2="360" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glass Sheen on Play Triangle -->
    <linearGradient id="playGlassSheen" x1="180" y1="160" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter for realism -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Clean dark backdrop that blends seamlessly into any Android launcher or store without squishing -->
  <rect width="512" height="512" fill="#080a0f" />

  <!-- Logo Group: Properly scaled, wide aspect ratio, perfectly centered -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)" filter="url(#shadow3D)">
    <!-- 1. Outer Red Top Shell -->
    <path
      d="M 175 32
         C 285 15, 420 95, 480 220
         C 515 285, 490 355, 420 400
         C 355 440, 260 485, 165 488
         C 105 488, 50 440, 32 370
         C 15 305, 25 210, 65 130
         C 98 68, 132 38, 175 32 Z"
      fill="url(#glossyRedShell)"
    />

    <!-- Outer Red Shell Specular Highlights -->
    <path
      d="M 180 40
         C 280 25, 405 102, 465 218
         C 490 268, 478 325, 428 365
         C 380 405, 305 445, 210 465
         C 305 415, 395 355, 430 292
         C 465 225, 418 125, 310 75
         C 258 50, 212 44, 180 40 Z"
      fill="url(#topRedHighlight)"
    />

    <!-- 2. Glossy Piano Black Left Body Shell -->
    <path
      d="M 175 38
         C 128 46, 82 96, 52 160
         C 18 235, 15 320, 35 380
         C 48 422, 85 458, 138 472
         C 190 486, 258 465, 320 435
         C 225 465, 142 450, 95 402
         C 52 355, 48 268, 75 195
         C 100 132, 138 72, 175 38 Z"
      fill="url(#pianoBlackWing)"
    />

    <!-- Specular Highlight on Black Wing Edge -->
    <path
      d="M 165 52
         C 122 70, 82 116, 60 176
         C 35 240, 32 315, 48 370
         C 60 408, 90 440, 132 455
         C 95 430, 68 390, 60 342
         C 48 280, 52 208, 80 150
         C 104 102, 135 62, 165 52 Z"
      fill="url(#blackSpecGlaze)"
    />

    <!-- 3. Aerodynamic Silver/Chrome Transition Ridge -->
    <path
      d="M 190 80
         C 148 122, 110 190, 96 262
         C 82 334, 105 400, 158 440
         C 210 478, 290 452, 362 405
         C 405 378, 435 330, 425 285
         C 415 238, 368 192, 320 152
         C 272 112, 230 88, 190 80 Z"
      fill="#0d1017"
      stroke="url(#chromeTrimGrad)"
      stroke-width="7"
    />

    <!-- 4. Inner Recessed Triangular Core Casing -->
    <path
      d="M 165 130
         L 375 242
         C 398 254, 398 270, 375 282
         L 165 394
         C 142 406, 120 394, 120 368
         L 120 156
         C 120 130, 142 118, 165 130 Z"
      fill="#040608"
      stroke="url(#innerRedBezel)"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- Glowing Neon Red Bezel Outline -->
    <path
      d="M 172 142
         L 362 248
         C 380 258, 380 268, 362 278
         L 172 384
         C 152 394, 134 384, 134 362
         L 134 164
         C 134 142, 152 132, 172 142 Z"
      fill="#d90404"
      stroke="#ff4d4d"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- 5. Center 3D Pearl White Glossy Play Triangle - WIDE & EQUILATERAL (Not chapta) -->
    <path
      d="M 180 160
         L 348 250
         C 362 258, 362 268, 348 276
         L 180 366
         C 164 374, 150 365, 150 346
         L 150 180
         C 150 161, 164 152, 180 160 Z"
      fill="url(#pearlWhitePlay)"
      stroke="#ffffff"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Play Triangle Glass Reflection -->
    <path
      d="M 152 180
         L 152 264
         L 282 262
         L 345 255
         C 350 252, 345 250, 340 247
         L 180 160
         C 164 152, 152 161, 152 180 Z"
      fill="url(#playGlassSheen)"
    />

    <!-- Bottom Chrome Bevel Edge of Play Button -->
    <path
      d="M 154 346
         C 154 360, 166 366, 178 360
         L 344 272"
      stroke="#94a3b8"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Star Specular Sparkle Glints -->
    <circle cx="430" cy="295" r="4" fill="#ffffff" />
    <circle cx="85" cy="390" r="3.5" fill="#ffffff" />
    <circle cx="410" cy="140" r="3" fill="#ffffff" />
  </g>
</svg>